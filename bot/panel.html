<style>
:root {
  --bg: #0b0e0f; --panel: #14181a; --raised: #1b2023; --line: #262d31; --text: #e8ecee; --muted: #8b979d;
  --accent: #53fc18; --accent-ink: #062100; --danger: #ff5f5f; --warn: #ffb84d; --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
input[type=radio], input[type=checkbox] { accent-color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 20px; background: rgba(11,14,15,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.brand b { color: var(--accent); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px;
  background: var(--raised); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok { color: var(--text); } .pill.ok::before { background: var(--accent); }
.pill.bad { color: var(--text); } .pill.bad::before { background: var(--danger); }
.pill.warn { color: var(--text); } .pill.warn::before { background: var(--warn); }
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
nav { position: sticky; top: 58px; align-self: start; padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; }
nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border: 0;
  background: none; padding: 9px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; }
nav button:hover { background: var(--panel); color: var(--text); }
nav button.on { background: var(--panel); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.count { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 11px; padding: 1px 7px; border-radius: 99px; }
main { padding: 22px 20px 110px; min-width: 0; }
h1 { font-size: 20px; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
.card h2 { font-size: 14px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
label.field { display: flex; flex-direction: column; gap: 5px; }
label.field > span:first-child { font-weight: 600; font-size: 13px; }
.hint { color: var(--muted); font-size: 12px; }
input[type=text], input[type=password], input[type=number], textarea, select { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; width: 100%; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 64px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 160px; }
.btn { border: 1px solid var(--line); background: var(--raised); padding: 7px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--danger); } .btn.danger:hover { border-color: var(--danger); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.switch { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.switch input { appearance: none; flex: none; width: 40px; height: 22px; border-radius: 99px; background: var(--line); position: relative;
  cursor: pointer; transition: background .15s; margin: 2px 0 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--text); transition: transform .15s; }
.switch input:checked { background: var(--accent); } .switch input:checked::after { transform: translateX(18px); background: var(--accent-ink); }
.switch b { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--raised); border: 1px solid var(--line);
  border-radius: 99px; padding: 4px 6px 4px 12px; }
.chip .kind { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; cursor: pointer; background: none; }
.chip .kind.any { color: var(--warn); border-color: var(--warn); }
.words { display: flex; flex-direction: column; gap: 6px; }
.word { display: grid; grid-template-columns: minmax(120px, 1fr) 190px auto auto; gap: 8px; align-items: center; background: var(--raised);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.word .sum { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.word .sum b { color: var(--warn); font-weight: 600; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; max-width: 520px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h2 { margin: 0 0 4px; font-size: 16px; } dialog .field { margin-top: 14px; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.opts label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.opts label.on { border-color: var(--accent); } .opts b { display: block; font-weight: 600; }
table.usertable { width: 100%; border-collapse: collapse; } table.usertable th, table.usertable td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.usertable th { color: var(--muted); font-weight: 600; font-size: 12px; } table.usertable td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.usertable th.n { text-align: right; } .flag { color: var(--danger); font-weight: 700; } .zero { color: var(--muted); }
@media (max-width: 760px) { .word { grid-template-columns: 1fr auto auto; } .word select { grid-column: 1 / -1; } }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
.x:hover { color: var(--danger); }
.empty { color: var(--muted); padding: 26px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); background: none; color: var(--muted); padding: 6px 14px; border-radius: 99px; cursor: pointer; }
.tabs button.on { color: var(--text); border-color: var(--accent); }
.item-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--raised); border: 1px solid var(--line); text-transform: uppercase; letter-spacing: .4px; }
.tag.open { color: var(--warn); border-color: var(--warn); }
.who { font-weight: 700; }
.when { color: var(--muted); font-size: 12px; margin-left: auto; }
.msgs { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.msg { display: flex; gap: 10px; align-items: baseline; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.msg .u { color: var(--accent); font-weight: 600; flex: none; }
.msg .t { flex: 1; overflow-wrap: anywhere; }
.users { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.users input[type=number] { width: 76px; padding: 3px 8px; }
.notes { margin: 10px 0 0; padding: 8px 10px; background: var(--bg); border-left: 3px solid var(--accent); border-radius: 4px;
  font-size: 12px; color: var(--muted); white-space: pre-wrap; }
.savebar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: none; align-items: center; gap: 14px;
  background: var(--raised); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 14px 10px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.5); z-index: 9; }
.savebar.show { display: flex; }
.toast { position: fixed; right: 20px; top: 70px; background: var(--raised); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  padding: 10px 14px; border-radius: 8px; max-width: 420px; z-index: 10; overflow-wrap: anywhere; }
.toast.err { border-left-color: var(--danger); }
.result { margin-top: 10px; font-size: 13px; }
.steps { margin: 0 0 12px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.steps code, .copy { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.done { color: var(--accent); font-weight: 700; }
a.btn { text-decoration: none; display: inline-block; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
#power { min-width: 92px; font-weight: 700; }
#power.on { color: var(--danger); } #power.off { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.result .hit { color: var(--danger); font-weight: 600; } .result .clean { color: var(--accent); }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; flex-direction: row; overflow-x: auto; padding: 10px 14px 0; }
  nav button { white-space: nowrap; } nav button.on { box-shadow: inset 0 -3px 0 var(--accent); }
}
.kchat { background: #0b0b0c; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-top: 6px; word-break: break-word; }
.kchat b { color: var(--accent); margin-right: 4px; }
.kchat img { height: 28px; vertical-align: middle; margin: 0 1px; }
.epick { position: relative; }
.epanel { position: absolute; right: 0; top: 100%; z-index: 10; width: 340px; max-height: 360px; overflow: auto; padding: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.epanel input { width: 100%; margin-bottom: 6px; }
.epanel h3 { font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
.epanel button { background: none; border: 0; padding: 3px; border-radius: 6px; cursor: pointer; }
.epanel button:hover { background: var(--raised); }
.epanel img { width: 32px; height: 32px; object-fit: contain; display: block; }
</style>
</head>
<body>
<header>
  <div class="brand">kick<b>-bot</b></div>
  <select id="channel" title="Botun çalıştığı kanal" style="width:auto"></select>
  <div class="spacer"></div>
  <div id="pills" class="row"></div>
  <button class="btn" id="power"></button>
  <button class="btn danger" id="quit" title="Botu tamamen kapatır">Kapat</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="savebar" id="savebar"><span>Kaydedilmemiş değişiklik var</span>
  <button class="btn" id="discard">Vazgeç</button><button class="btn primary" id="save">Kaydet</button></div>
<script>
"use strict";
// Chat mesajları güvenilmeyen içeriktir: sayfaya yalnızca metin düğümü olarak eklenir, asla HTML olarak değil.
const PAGES = [["kurulum", "Kurulum"], ["genel", "Genel"], ["kelime", "Yasaklı kelimeler"], ["caps", "Büyük harf"], ["spam", "Spam koruması"], ["kullanici", "Kullanıcılar"], ["duyuru", "Duyurular"], ["komut", "Komutlar"], ["yardimci", "Geçici moderatörler"], ["model", "Yapay zekâ"], ["inceleme", "İnceleme"]];
const RULES = { blacklist: "Yasaklı kelime", caps: "Büyük harf", spam: "Spam", etiket: "Etiket", llm: "Yapay zekâ", hedefli: "Hedefli kelime", panel: "Elle", mod: "Başka moderatör", yardimci: "Geçici moderatör" };
const ACTIONS = { delete: "mesaj silindi", timeout: "susturuldu (timeout)", ban: "banlandı", inceleme: "inceleme bekliyor", sil: "model sildi", serbest: "model serbest bıraktı" };
let hist = null, leaving = false, users = null, cfg = null, saved = "", page = location.hash.slice(1), status = {}, openCount = 0, items = [], itemsKey = "", filter = "open";

const $ = id => document.getElementById(id);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || ("Hata " + r.status));
  return j;
}
function toast(text, err) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", { class: "toast" + (err ? " err" : "") }, text);
  document.body.append(t);
  setTimeout(() => t.remove(), err ? 7000 : 3000);
}
const get = path => path.split(".").reduce((o, k) => o[k], cfg);
function set(path, value) {
  const keys = path.split("."), last = keys.pop();
  keys.reduce((o, k) => o[k], cfg)[last] = value;
  markDirty();
}
const isDirty = () => JSON.stringify(cfg) !== saved;
function markDirty() { $("savebar").classList.toggle("show", isDirty()); }

// ---- alan yardımcıları
function num(path, label, hint) {
  return h("label", { class: "field" }, h("span", null, label),
    h("input", { type: "number", min: 1, value: get(path), oninput: e => set(path, Math.trunc(Number(e.target.value)) || 0) }),
    hint && h("span", { class: "hint" }, hint));
}
function text(path, label, hint) {
  return h("label", { class: "field" }, h("span", null, label),
    h("input", { type: "text", value: get(path), oninput: e => set(path, e.target.value) }), hint && h("span", { class: "hint" }, hint));
}
function toggle(path, label, hint) {
  return h("label", { class: "switch" }, h("input", { type: "checkbox", checked: get(path), onchange: e => set(path, e.target.checked) }),
    h("span", null, h("b", null, label), hint && h("span", { class: "hint" }, hint)));
}
// Emoteler bir kez çekilir; önizleme ve seçici aynı listeyi kullanır.
let emoteGroups = null, emoteLoad = null;
const emoteImg = (id, name) => h("img", { src: `https://files.kick.com/emotes/${id}/fullsize`, alt: name, title: name, loading: "lazy" });
function loadEmotes() {
  emoteLoad ??= fetch("/api/emotes").then(r => r.json()).then(d => { if (d.error) throw new Error(d.error); emoteGroups = d; })
    .catch(e => { emoteLoad = null; toast("Emoteler alınamadı: " + e.message, true); });
  return emoteLoad;
}
// Kick chat görünümü: botun mesajı chatte nasıl görünecekse.
function kickPreview(box, text) {
  const draw = () => {
    const ids = Object.fromEntries((emoteGroups || []).flatMap(g => g.emotes.map(e => [e.name, e.id])));
    const parts = text.split(/(\[emote:\d+:[^\]]*\]|\s+)/).map(t => {
      const m = t.match(/^\[emote:(\d+):([^\]]*)\]$/);
      return m ? emoteImg(m[1], m[2]) : ids[t] ? emoteImg(ids[t], t) : t;
    });
    box.replaceChildren(h("b", null, (cfg.nick || "bot") + ":"), ...parts);
  };
  draw();
  if (!emoteGroups) loadEmotes().then(() => emoteGroups && box.isConnected && draw());
}
function emotePicker(onPick) {
  let panel = null;
  const wrap = h("div", { class: "epick" });
  const close = e => { if (!wrap.contains(e.target)) { panel?.remove(); panel = null; document.removeEventListener("mousedown", close); } };
  const open = async () => {
    if (panel) return close({ target: document.body });
    await loadEmotes();
    if (!emoteGroups) return;
    const list = h("div");
    const search = h("input", { placeholder: "Emote ara", oninput: () => fill(search.value.toLowerCase()) });
    const fill = q => list.replaceChildren(...emoteGroups.map(g => {
      const hits = g.emotes.filter(e => e.name.toLowerCase().includes(q));
      return hits.length && [h("h3", null, g.name), h("div", null, hits.map(e => h("button", { type: "button", title: e.name, onclick: () => onPick(e.name) }, emoteImg(e.id, e.name))))];
    }));
    fill("");
    panel = h("div", { class: "epanel" }, search, list);
    wrap.append(panel);
    search.focus();
    document.addEventListener("mousedown", close);
  };
  wrap.append(h("button", { class: "btn", type: "button", title: "Emote ekle", onclick: open }, "☺"));
  return wrap;
}
const card = (title, ...kids) => h("section", { class: "card" }, title && h("h2", null, title), ...kids);
const head = (title, lead) => [h("h1", null, title), h("p", { class: "lead" }, lead)];

// ---- yasaklı kelime seçenekleri
const BADGE_NAMES = { broadcaster: "Yayıncı", moderator: "Moderatör", vip: "VIP", og: "OG", subscriber: "Abone", founder: "Kurucu" };
const MATCH_NAMES = { exact: "Birebir", variants: "Türevleriyle", anywhere: "Her yerde" };
const MATCH_HELP = {
  exact: "Kelime tam olarak yazıldığı gibi aranır; yalnızca büyük/küçük harf fark etmez. \"oç\" yasaksa \"oc\", \"o ç\", \"oçç\" ve \"oçlar\" serbest kalır.",
  variants: "Kelime ayrı bir sözcük olarak aranır, ama kaçamak yazımlar da yakalanır: harf uzatma (\"oççç\"), Türkçe harfsiz yazım (\"seftali\"), boşluklu (\"ş e f t a l i\") ve rakamlı (\"seftal1\"). Ekli hâller (\"oçlar\") yakalanmaz.",
  anywhere: "Türevleriyle aynı, ayrıca başka bir sözcüğün içinde geçse bile yakalar (\"koç\" içindeki \"oç\" gibi). Kısa kelimelerde masum mesajları da vurabilir.",
};
const ACTION_NAMES = { standard: "Standart ceza", delete: "Yalnızca sil", timeout: "Doğrudan timeout", ban: "Doğrudan ban" };
const ACTION_HELP = {
  standard: "Mesaj silinir. Kullanıcının toplam ihlali sayılır: belirlenen ihlale kadar yalnızca silinir, o ihlalde timeout, sonrasında ban atılır.",
  delete: "Mesaj silinir, başka bir şey olmaz. Kullanıcının ihlal sayacına da yazılmaz.",
  timeout: "Mesaj silinir ve kullanıcı ilk seferinde susturulur (timeout). Süreyi aşağıdan seçersin.",
  ban: "Mesaj silinir ve kullanıcı ilk seferinde kalıcı olarak banlanır. Dikkatli kullan.",
};
function wordDialog(w) {
  const dlg = h("dialog");
  const draw = () => {
    const minutes = h("input", { type: "number", min: 0, max: 10080, value: w.minutes, oninput: e => { w.minutes = Math.max(0, Math.trunc(Number(e.target.value)) || 0); markDirty(); } });
    dlg.replaceChildren(
      h("h2", null, `"${w.word}" ayarları`),
      h("p", { class: "hint", style: "margin:0" }, "Hiçbir şeyi değiştirmezsen standart ayarlar geçerli kalır."),
      h("div", { class: "field" }, h("b", null, "Nasıl aransın?"),
        h("div", { class: "opts" }, Object.entries(MATCH_NAMES).map(([k, v]) => h("label", { class: w.match === k ? "on" : "" },
          h("input", { type: "radio", name: "m", checked: w.match === k, onchange: () => { w.match = k; markDirty(); draw(); } }),
          h("span", null, h("b", null, v), h("span", { class: "hint" }, MATCH_HELP[k])))))),

const current = () => cfg.channels.find(c => c.slug.toLowerCase() === cfg.channel.toLowerCase());
const ready = () => !!(current() && current().chatroom_id);
async function saveCfg(message) {
  try {
    await api("/api/config", cfg);
    saved = ""; cfg = null; await poll(); render(); itemsKey = ""; if (page === "inceleme") await loadItems();
    toast(message || "Kaydedildi, bot yeni ayarlarla çalışıyor");
    return true;
  } catch (e) { toast(e.message, true); if (cfg) render(); return false; }  // ekran her zaman bellekteki ayarı göstersin
}
// Chat odası numarasını Kick yalnızca kendi sitesinde veriyor: kullanıcı sayfayı kendi tarayıcısında açıp yapıştırır.
function roomHelper(c) {
  const box = h("textarea", { placeholder: "Açılan sayfadaki yazının tamamını buraya yapıştır (Ctrl+V)", oninput: e => {
    const t = e.target.value, m = /"chatroom"\s*:\s*\{[^{}]*?"id"\s*:\s*(\d+)/.exec(t), plain = /^\s*(\d{3,})\s*$/.exec(t);
    if (!t.trim()) return;
    if (m && !t.toLowerCase().includes(`"slug":"${c.slug.toLowerCase()}"`)) return toast(`Yapıştırdığın sayfa ${c.slug} kanalına ait değil`, true);
    if (!m && !plain) return toast("Bu yazıda chat odası bulunamadı. Sayfanın tamamını kopyaladığından emin ol (Ctrl+A, sonra Ctrl+C).", true);
    // Sayfa çizildikten sonra ayar yenilenmiş olabilir: kanalı güncel listeden adıyla bul.
    const ch = cfg.channels.find(x => x.slug.toLowerCase() === c.slug.toLowerCase());
    if (!ch) return toast(`${c.slug} kanalı listede yok; sayfayı yenileyip yeniden dene`, true);
    ch.chatroom_id = Number((m || plain)[1]);
    saveCfg(`${c.slug} kanalının chat odası bağlandı`).then(ok => { if (!ok) ch.chatroom_id = 0; });
  } });
  return h("div", null,
    h("ol", { class: "steps" },
      h("li", null, h("a", { class: "btn small", href: "https://kick.com/api/v2/channels/" + encodeURIComponent(c.slug), target: "_blank", rel: "noopener" }, "Kick sayfasını aç"),
        " (yeni sekmede karışık bir yazı açılır, normaldir)"),
      h("li", null, "O sekmede ", h("code", null, "Ctrl+A"), " ile hepsini seç, ", h("code", null, "Ctrl+C"), " ile kopyala"),
      h("li", null, "Bu sayfaya dön ve aşağıdaki kutuya ", h("code", null, "Ctrl+V"), " ile yapıştır")),
    box);
}

      card("Mesajlar",
        list.length ? list.map((m, i) => {
          const counter = h("span", { class: "hint" }, `${m.text.length}/500`);
          const preview = h("div", { class: "kchat" });
          const ta = h("textarea", { maxlength: 500, value: m.text, oninput: () => changed() });
          const changed = () => { m.text = ta.value; counter.textContent = `${ta.value.length}/500`; kickPreview(preview, ta.value); markDirty(); };
          kickPreview(preview, m.text);
          return h("div", { class: "row", style: "margin-bottom:12px;align-items:flex-start" },
            h("input", { type: "checkbox", checked: m.active, title: "Açıkken bu duyuru atılır", onchange: e => { m.active = e.target.checked; markDirty(); } }),
            h("div", { class: "grow" }, ta, counter, preview),
            emotePicker(name => { const at = ta.selectionStart ?? ta.value.length, before = ta.value.slice(0, at);
              const ins = (before && !/\s$/.test(before) ? " " : "") + name + " ";
              ta.setRangeText(ins, at, ta.selectionEnd ?? at, "end"); ta.focus(); changed(); }),
            h("button", { class: "x", title: "Sil", onclick: () => { list.splice(i, 1); markDirty(); render(); } }, "×"));
        }) : h("div", { class: "empty", style: "margin-bottom:10px" }, "Duyuru yok; bot chate bir şey yazmaz."),
        h("button", { class: "btn", onclick: () => { list.push({ text: "Yeni duyuru", active: true }); markDirty(); render(); } }, "Duyuru ekle")),
      card("Emoteler", (() => {
        const tok = h("input", { type: "password", placeholder: status.session ? "Kayıtlı (değiştirmek için yapıştır)" : "session_token değeri" });
        const send = async v => { try { await api("/api/session", { token: v }); await poll(); render(); toast(v ? "Kaydedildi" : "Silindi"); } catch (e) { toast(e.message, true); } };
        return [h("p", { class: "hint", style: "margin-top:0" }, "Duyuruda emotenin adını chate yazar gibi yaz (ör. KEKW). Kanalın, global ve emoji emoteleri kendiliğinden çalışır. Senin sahip olduğun emoteler için kick.com oturum token'ı gerekir: tarayıcıda kick.com'a giriş yap, F12 > Application (Depolama) > Cookies > kick.com > session_token değerini kopyala."),
          h("div", { class: "row" }, h("div", { class: "grow" }, tok),
            h("button", { class: "btn", onclick: () => send(tok.value) }, "Kaydet"),
            status.session && h("button", { class: "btn", onclick: () => send("") }, "Sil"))];
      })()),
      card("Zamanlama", h("div", { class: "grid" },
        num("announcements.gap_minutes", "İki duyuru arası (dk)"),
        num("announcements.repeat_min_minutes", "Aynı duyuru en erken (dk)", "Bu süre dolmadan aynı duyuru tekrar atılmaz."),
        num("announcements.repeat_max_minutes", "Aynı duyuru en geç (dk)", "Bu süre dolunca o duyuru öne alınır.")))];
  },
  komut() {
    const list = cfg.commands.items;
    return [...head("Komutlar", "Biri chate komutu yazınca bot onu etiketleyerek cevabı yazar. Örnek: ahmet \"!abone\" yazarsa bot \"@ahmet abone olmak için …\" yazar."),
      card("Komut listesi",
        list.length ? list.map((c, i) => h("div", { class: "row", style: "margin-bottom:8px;align-items:flex-start" },
          h("input", { type: "text", style: "width:150px", maxlength: 30, placeholder: "!komut", value: c.trigger, oninput: e => { c.trigger = e.target.value.trim(); markDirty(); } }),
          h("div", { class: "grow" }, h("textarea", { maxlength: 450, placeholder: "cevap metni", value: c.response, oninput: e => { c.response = e.target.value; markDirty(); } })),
          h("button", { class: "x", title: "Sil", onclick: () => { list.splice(i, 1); markDirty(); render(); } }, "×")))
          : h("div", { class: "empty", style: "margin-bottom:10px" }, "Henüz komut yok."),
        h("button", { class: "btn", onclick: () => { list.push({ trigger: "!komut", response: "cevap metni" }); markDirty(); render(); } }, "Komut ekle"),
        h("p", { class: "hint" }, "Komut tek kelime olmalı; yalnızca mesajın ilk kelimesiyse çalışır (\"!abone nasıl olunur\" çalışır, \"bana !abone linki ver\" çalışmaz). Büyük/küçük harf fark etmez. Bir mesajda birden fazla komut varsa listede önce gelen cevaplanır. Komutlar yayın kapalıyken de çalışır ve herkes kullanabilir.")),
      card("Bekleme", h("div", { class: "grid" },
        num("commands.cooldown_seconds", "Aynı komut için bekleme (sn)", "Bu süre içinde aynı komut tekrar yazılırsa bot cevap vermez; chat dolmasın diye.")))];
  },
  yardimci() {
    const hp = cfg.helpers, DO = { delete: "Mesajı sil", timeout: "Sustur (timeout)", ban: "Banla" };
    return [...head("Geçici moderatörler", "Buraya yazdığın kişiler, bir mesajı komutla cevaplayınca bot o işlemi senin yerine yapar. Örnek: ahmet birinin mesajına \"!to\" diye cevap yazarsa o kişi susturulur. Her işlem İnceleme → Tüm kayıtlar'da \"ahmet istedi\" diye kaydedilir."),
      card("Kişiler",
        hp.nicks.length ? hp.nicks.map((n, i) => h("div", { class: "row", style: "margin-bottom:8px" },
          h("input", { type: "text", maxlength: 50, placeholder: "kullanıcı adı", value: n, oninput: e => { hp.nicks[i] = e.target.value.trim(); markDirty(); } }),
          h("button", { class: "x", title: "Sil", onclick: () => { hp.nicks.splice(i, 1); markDirty(); render(); } }, "×")))
          : h("div", { class: "empty", style: "margin-bottom:10px" }, "Kimseye yetki verilmedi."),
        h("button", { class: "btn", onclick: () => { hp.nicks.push("kullanıcı"); markDirty(); render(); } }, "Kişi ekle"),
        h("p", { class: "hint" }, "Yetki, sen listeden silene kadar sürer. Yayıncıya, muaf rozetli kişilere ve listedeki diğer kişilere işlem yapılamaz.")),
      card("Komutlar",
        hp.commands.map((c, i) => h("div", { class: "row", style: "margin-bottom:8px" },
          h("input", { type: "text", style: "width:120px", maxlength: 30, placeholder: "!komut", value: c.trigger, oninput: e => { c.trigger = e.target.value.trim(); markDirty(); } }),
          h("select", { onchange: e => { c.do = e.target.value; markDirty(); render(); } }, ...Object.entries(DO).map(([k, t]) => h("option", { value: k, selected: c.do === k }, t))),
          c.do === "timeout" && h("input", { type: "number", style: "width:80px", min: 1, value: c.minutes || 5, oninput: e => { c.minutes = +e.target.value; markDirty(); } }),
          c.do === "timeout" && h("span", { class: "hint" }, "dk"),
          h("button", { class: "x", title: "Sil", onclick: () => { hp.commands.splice(i, 1); markDirty(); render(); } }, "×"))),
        h("button", { class: "btn", onclick: () => { hp.commands.push({ trigger: "!komut", do: "delete", minutes: 0 }); markDirty(); render(); } }, "Komut ekle"),
        h("p", { class: "hint" }, "Komut, cevap mesajının ilk kelimesi olmalı. Mesaj her durumda silinir; \"Sustur\" ve \"Banla\" ek olarak kişiyi cezalandırır. Banı da süreli susturma yapmak istersen komutu \"Sustur\" seç."))];
  },
  model() {
    return [...head("Yapay zekâ", "Açıkken iki işe bakar: nick'in etiketlendiğinde son mesajları yorumlar ve \"hedefliyse yasak\" kelimelerin birine yöneltilip yöneltilmediğine karar verir. Kapalıyken ikisi de doğrudan İnceleme kuyruğuna düşer."),
      card(null, toggle("llm.enabled", "Yapay zekâyı kullan", "Bilgisayarın belleği doluyken model cevap veremeyebilir."),
        h("div", { style: "height:12px" }),
        toggle("llm.dry_run", "Kararları uygulama, yalnızca kaydet", "Açıkken model hiçbir şey silmez, kararları İnceleme kuyruğuna düşer. Kapalıyken model mesajı kendisi siler. Timeout ve ban kararı her durumda sende; model bunları atmaz.")),
      card("Ayarlar", h("div", { class: "grid" },
        text("llm.url", "Ollama adresi"), text("llm.model", "Model adı"),
        num("llm.context_messages", "İncelenen son mesaj sayısı", "Model kapalıyken de inceleme kaydına bu kadar mesaj eklenir."))),
      card("Kanal kuralları ve örnek kararlar",
        h("textarea", { style: "min-height:220px;font-family:ui-monospace,monospace;font-size:12px", value: get("llm.examples"), oninput: e => set("llm.examples", e.target.value) }),
        h("p", { class: "hint" }, "Bu metnin tamamı modele verilir."))];
  },
  kullanici() {
    if (!users) { loadUsers(); return [...head("Kullanıcılar", "Yükleniyor…")]; }
    const num = (v, flag) => h("td", { class: "n " + (v ? (flag ? "flag" : "") : "zero") }, v);
    return [...head("Kullanıcılar", "Kural ihlali yapmış kullanıcılar ve bu kanalda aldıkları aksiyonlar. Veriler seçili kanala aittir."),
      users.length ? card(null, h("table", { class: "usertable" },
        h("thead", null, h("tr", null, h("th", null, "Kullanıcı"), h("th", { class: "n" }, "Silinen mesaj"), h("th", { class: "n" }, "Timeout"),
          h("th", { class: "n" }, "Ban"), h("th", { class: "n" }, "Güncel ihlal sayacı"), h("th", null, "Son olay"), h("th", null, ""))),
        h("tbody", null, users.map(u => h("tr", null, h("td", null, h("b", null, u.username)), num(u.deleted), num(u.timeouts, true), num(u.bans, true), num(u.strikes),
          h("td", { class: "hint" }, new Date(u.last * 1000).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })),
          h("td", null, h("button", { class: "btn small", onclick: async () => {
            try { hist = { name: u.username, ...await api("/api/user?id=" + u.user_id) }; render(); } catch (e) { toast(e.message, true); } } }, "Geçmiş"), " ", u.strikes ? h("button", { class: "btn small", onclick: async () => {
            if (!confirm(`${u.username} kullanıcısının ihlal sayacı sıfırlansın mı? (Geçmiş kayıtlar silinmez.)`)) return;
            try { await api("/api/action", { action: "reset_user", user_id: u.user_id }); await loadUsers(); } catch (e) { toast(e.message, true); } } }, "Sayacı sıfırla") : null))))))
        : h("div", { class: "empty" }, "Henüz kayıtlı bir ihlal yok."),
      hist && card(`${hist.name} geçmişi`, h("button", { class: "btn small", onclick: () => { hist = null; render(); } }, "Kapat"),
        h("h4", null, "İhlaller ve silinen mesajlar"),
        hist.violations.map(v => h("div", { class: "msg" }, h("span", { class: "u" }, new Date(v.at * 1000).toLocaleString("tr-TR")),
          h("span", { class: "t" }, [RULES[v.rule] || v.rule, ACTIONS[v.action] || v.action, v.detail, ...v.evidence.filter(m => m.user_id === v.user_id).map(m => `"${m.content}"`)].filter(Boolean).join(" · ")))),
        h("h4", null, "Mesaj geçmişi"),
        hist.messages.map(m => h("div", { class: "msg" }, h("span", { class: "u" }, new Date(m.at * 1000).toLocaleString("tr-TR")), h("span", { class: "t" }, m.content)))),
      h("p", { class: "hint" }, "Silinen mesaj: yasaklı kelime nedeniyle ya da panelden silinenler. Geçmiş kayıtlar ve mesajlar sayaç sıfırlansa da silinmez. Güncel ihlal sayacı, \"Standart ceza\" kelimelerinde timeout ve ban sırasını belirler.")];
  },
  inceleme() {
    return [...head("İnceleme", "Botun aldığı aksiyonlar ve senin kararını bekleyen etiketler. Buradan mesaj silebilir, timeout ya da ban atabilir, cezayı kaldırabilirsin."),
      h("div", { class: "tabs" }, [["open", `İncelenecek${openCount ? " (" + openCount + ")" : ""}`], ["all", "Tüm kayıtlar"]].map(([k, l]) =>
        h("button", { class: filter === k ? "on" : "", onclick: () => { filter = k; itemsKey = ""; loadItems(); } }, l))),
      items.length ? items.map(itemCard) : h("div", { class: "empty" }, filter === "open" ? "İncelenecek bir şey yok." : "Henüz kayıt yok.")];
  },
};

function itemCard(v) {
  const users = new Map([[v.user_id, v.username]]);
  v.evidence.forEach(m => users.set(m.user_id, m.username));
  const act = async (body, sure) => {
    if (sure && !confirm(sure)) return;
    try {
      await api("/api/action", { id: v.id, ...body });
      toast(cfg.dry_run && !["close", "reopen", "reset", "teach"].includes(body.action) ? "Yazdırma modu açık: aksiyon uygulanmadı, yalnızca kaydedildi" : "Tamam");
      itemsKey = ""; await loadItems(); await poll();
    } catch (e) { toast(e.message, true); }
  };
  const note = h("input", { type: "text", maxlength: 200, placeholder: "istersen sebebini yaz (ör. isim + senin = kişiye yönelik)" });
  const teach = label => act({ action: "teach", label, note: note.value });
  return h("section", { class: "card" },
    h("div", { class: "item-head" },
      h("span", { class: "tag" + (v.status === "open" ? " open" : "") }, RULES[v.rule] || v.rule),
      h("span", { class: "who" }, v.username),
      h("span", { class: "hint" }, [v.count ? `ihlal #${v.count}` : null, ACTIONS[v.action] || v.action, v.detail].filter(Boolean).join(" · ")),
      h("span", { class: "when" }, new Date(v.at * 1000).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))),
    h("div", { class: "msgs" }, v.evidence.map(m => h("div", { class: "msg" }, h("span", { class: "u" }, m.username), h("span", { class: "t" }, m.content),
      h("button", { class: "btn small danger", onclick: () => act({ action: "delete", message_id: m.id }) }, "Mesajı sil")))),
    h("div", { class: "users" }, [...users].map(([uid, name]) => {
      const minutes = h("input", { type: "number", min: 1, max: 10080, value: 10, title: "dakika" });
      return h("div", { class: "row" }, h("span", { class: "who", style: "min-width:120px" }, name),
        minutes, h("button", { class: "btn small", onclick: () => act({ action: "timeout", user_id: uid, minutes: Math.trunc(Number(minutes.value)) }) }, "dk timeout"),
        h("button", { class: "btn small danger", onclick: () => act({ action: "ban", user_id: uid }, `${name} kalıcı olarak banlansın mı?`) }, "Banla"),
        h("button", { class: "btn small", onclick: () => act({ action: "unban", user_id: uid }) }, "Cezayı kaldır"),
        h("button", { class: "btn small", onclick: () => act({ action: "reset", user_id: uid }, `${name} kullanıcısının ihlal sayaçları sıfırlansın mı?`) }, "Sayaçları sıfırla"));
    })),
    v.rule === "hedefli" && h("div", { class: "row", style: "margin-top:12px" }, h("span", { class: "hint" }, "Modele öğret:"), h("div", { class: "grow" }, note),
      h("button", { class: "btn small danger", onclick: () => teach("kisi") }, "Kişiye yönelik"),
      h("button", { class: "btn small", onclick: () => teach("serbest") }, "Kişiye yönelik değil")),
    v.notes && h("div", { class: "notes" }, v.notes.trim()),
    h("div", { class: "row", style: "margin-top:12px;justify-content:flex-end" },
      v.status === "open" ? h("button", { class: "btn primary", onclick: () => act({ action: "close" }) }, "İncelendi, kapat")
        : h("button", { class: "btn", onclick: () => act({ action: "reopen" }) }, "Yeniden aç")));
}

// ---- çizim ve veri
function render() {
  $("nav").replaceChildren(...PAGES.map(([k, l]) => h("button", { class: page === k ? "on" : "", onclick: () => go(k) }, l,
    k === "inceleme" && openCount ? h("span", { class: "count" }, openCount) : null)));
  $("channel").replaceChildren(...cfg.channels.map(c => h("option", { value: c.slug }, c.slug)));
  $("channel").hidden = !cfg.channels.length;
  if (current()) $("channel").value = current().slug;
  $("power").textContent = status.running ? "Durdur" : "Başlat";
  $("power").className = "btn " + (status.running ? "on" : "off");
  $("pills").replaceChildren(
    h("span", { class: "pill " + (status.running ? "ok" : "warn") }, status.running ? "Çalışıyor" : "Durduruldu"),
    h("span", { class: "pill " + (status.chat ? "ok" : "bad") }, status.chat ? "Chat bağlı" : "Chat bağlı değil"),
    h("span", { class: "pill " + (status.logged_in ? "ok" : "bad") }, status.logged_in ? "Kick girişi var" : "Kick girişi yok"),
    h("span", { class: "pill " + (status.live ? "ok" : "") }, status.live == null ? "Yayın: bilinmiyor" : status.live ? "Yayın açık" : "Yayın kapalı"),
    h("span", { class: "pill " + (JSON.parse(saved).dry_run ? "warn" : "ok") }, JSON.parse(saved).dry_run ? "Yazdırma modu" : "Gerçek mod"));
  if (!VIEWS[page]) page = ready() && status.logged_in ? "genel" : "kurulum";  // kurulum bitmediyse oradan başla
  $("main").replaceChildren(...VIEWS[page]().flat(3).filter(Boolean));
  markDirty();
}
function go(k) { page = k; location.hash = k; if (k === "kullanici") { users = null; hist = null; } if (k === "inceleme") { itemsKey = ""; loadItems(); } else render(); }
async function loadUsers() {
  try { users = await api("/api/users"); if (page === "kullanici") render(); } catch (e) { toast(e.message, true); }
}
async function loadItems() {
  try {
    const data = await api("/api/violations?status=" + filter), key = JSON.stringify(data);
    if (key === itemsKey) return;   // değişmediyse yeniden çizme: yazılan süre ve odak kaybolmasın
    items = data; itemsKey = key;
    if (page === "inceleme") render();
  } catch (e) { toast(e.message, true); }
}
async function poll() {
  try {
    const s = await api("/api/state"), incoming = JSON.stringify(s.config);
    const changed = JSON.stringify(s.status) !== JSON.stringify(status) || s.open !== openCount || (!cfg || (!isDirty() && incoming !== saved));
    status = s.status; openCount = s.open;
    if (!cfg || (!isDirty() && incoming !== saved)) { cfg = s.config; saved = incoming; }
    // Ayar sayfasında yazarken yeniden çizme; yalnızca üst bilgi değiştiyse ve odak bir alanda değilse çiz.
    if (changed && !(document.activeElement && ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName))) render();
  } catch (e) { status = { ...status, chat: false }; }
}
$("save").onclick = () => saveCfg();
async function power(on) {
  try { await api("/api/run", { on }); await poll(); render(); toast(on ? "Bot başlatıldı" : "Bot durduruldu"); }
  catch (e) { toast(e.message, true); if (!ready()) go("kurulum"); }
}
$("power").onclick = () => power(!status.running);
async function quit() {
  if (!confirm("Bot tamamen kapatılsın mı? Yeniden açmak için uygulamayı tekrar çalıştırman gerekir.")) return;
  leaving = true;
  try { await api("/api/quit", {}); } catch (e) {}
  document.body.replaceChildren(h("div", { class: "empty", style: "margin:60px auto;max-width:420px" }, "Bot kapatıldı. Bu sekmeyi kapatabilirsin."));
}
$("quit").onclick = quit;
$("discard").onclick = () => { cfg = JSON.parse(saved); render(); };
$("channel").onchange = e => { set("channel", e.target.value); render(); };
// Sekmeyi kapatmak uygulamayı da kapatır: tarayıcı onay sorar; onaylanırsa sayfa kapanırken sunucuya haber gider
// (sayfa yenilemesinde sunucu 8 sn içinde yeni istek görüp kapanmaz).
window.addEventListener("beforeunload", e => { if (!leaving) e.preventDefault(); });
window.addEventListener("pagehide", () => { if (!leaving) navigator.sendBeacon("/api/bye", new Blob(["{}"], { type: "application/json" })); });
(async () => {
  await poll();
  if (!cfg) return $("main").replaceChildren(h("div", { class: "empty" }, "Bota ulaşılamıyor. Uygulama açık mı? Kapalıysa yeniden çalıştır."));
  render();
  if (page === "inceleme") loadItems();
  setInterval(() => { poll(); if (page === "inceleme") loadItems(); if (page === "kullanici") loadUsers(); }, 5000);
})();
</script>
</body>
</html>
